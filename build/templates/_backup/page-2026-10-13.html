<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Day @@DAY@@ · @@TITLE@@</title>
<style>
:root {
  --bg:#fbfaf7; --card:#fff; --line:#e8e4dc; --ink:#23201c; --dim:#8a8279;
  --accent:#d97706; --hi:#fde68a; --hi-ink:#78350f;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#1a1816; --card:#232020; --line:#3a3532; --ink:#ece7e0;
           --dim:#9a9188; --accent:#f59e0b; --hi:#78350f; --hi-ink:#fef3c7; }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:60px;
}
.wrap { max-width:720px; margin:0 auto; padding:16px; }
header { padding:8px 0 16px; border-bottom:1px solid var(--line); margin-bottom:16px; }
.kicker { color:var(--dim); font-size:13px; letter-spacing:.5px; }
h1 { font-size:22px; margin:6px 0 4px; font-weight:650; }
h1 .cn { font-size:15px; color:var(--dim); font-weight:400; display:block; margin-top:2px; }

.player {
  position:sticky; top:0; z-index:20; background:var(--card);
  border:1px solid var(--line); border-radius:14px; padding:12px 14px;
  margin-bottom:18px; box-shadow:0 2px 12px rgba(0,0,0,.05);
}
.row { display:flex; align-items:center; gap:12px; }
#play {
  width:46px; height:46px; flex:0 0 46px; border:none; border-radius:50%;
  background:var(--accent); color:#fff; font-size:17px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
#play:active { transform:scale(.94); }
.bar { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
#fill { height:100%; width:0; background:var(--accent); transition:width .1s linear; }
.time { font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; min-width:78px; text-align:right; }
.speeds { display:flex; gap:6px; margin-top:10px; }
.speeds button {
  flex:1; padding:7px 0; border:1px solid var(--line); background:transparent;
  color:var(--dim); border-radius:9px; font-size:13px; cursor:pointer;
}
.speeds button.on { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }

/* ── 显示模式切换 ─────────────────────────── */
.modes { display:flex; gap:6px; margin-top:8px; }
.modes button {
  flex:1; padding:7px 0; border:1px solid var(--line); background:transparent;
  color:var(--dim); border-radius:9px; font-size:13px; cursor:pointer;
}
.modes button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600; }

/* ── 逐句对照 ─────────────────────────────── */
.article { font-size:19px; line-height:2; letter-spacing:.1px; }
.pair { padding:8px 10px; margin:0 -10px 4px; border-radius:9px; transition:background .15s; }
.pair.now { background:var(--hi); }
.pair.now .zh { color:var(--hi-ink); opacity:.95; }
.pair .en { margin:0; }
.pair .zh {
  margin:5px 0 0; color:var(--dim); font-size:14.5px; line-height:1.75;
}

/* 模式：只看英文 / 只看中文 / 双语对照 */
body.mode-en .pair .zh { display:none; }
body.mode-zh .pair .en { display:none; }
body.mode-zh .article { font-size:17px; }

.w { transition:background .08s; border-radius:4px; padding:1px 0; cursor:pointer; }
.w.target { color:var(--accent); font-weight:600; }
.w.on { background:var(--accent); color:#fff; font-weight:600; }
.pair.now .w.on { background:var(--accent); color:#fff; }

h2 { font-size:15px; color:var(--dim); margin:28px 0 10px; font-weight:600;
      letter-spacing:.5px; text-transform:uppercase; }
.card { border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:var(--card); }
.card summary {
  list-style:none; padding:11px 13px; cursor:pointer; display:flex;
  flex-wrap:wrap; align-items:baseline; gap:8px; font-size:15px;
}
.card summary::-webkit-details-marker { display:none; }
.idx { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
.card .word { font-weight:650; font-size:16px; }
.card .ipa { color:var(--dim); font-size:12.5px; font-family:ui-monospace,monospace; }
.card .pos { color:var(--dim); font-size:12px; font-style:italic; }
.card .cn { color:var(--ink); opacity:.85; }
.card .body { padding:0 13px 13px; font-size:14px; line-height:1.85; border-top:1px solid var(--line); padding-top:11px; }
.lbl { display:inline-block; min-width:38px; color:var(--dim); font-size:12px; }
.sent { margin-bottom:6px; }
.root { margin-bottom:6px; }
.colloc { color:var(--accent); font-size:13.5px; margin-bottom:4px; }
.fam { color:var(--dim); font-size:13.5px; }

/* 刘晓燕的记忆法 —— 卡片里最该被看到的一块 */
.mnem {
  margin-bottom:7px; padding:8px 10px; border-radius:8px;
  background:color-mix(in srgb, var(--accent) 9%, transparent);
  font-size:14px; line-height:1.75;
}
/* 真题例句 */
.zt {
  margin-bottom:6px; padding-left:9px; border-left:2px solid var(--line);
  color:var(--dim); font-size:13.5px; line-height:1.7;
}
.body .lbl { font-size:11.5px; }
footer { margin-top:28px; padding-top:16px; border-top:1px solid var(--line);
          color:var(--dim); font-size:12.5px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="kicker">Day @@DAY@@ · @@DATE@@ · @@UNIT@@ 第 @@RANGE@@ 词</div>
  <h1>@@TITLE@@<span class="cn">@@TITLE_CN@@</span></h1>
</header>

<div class="player">
  <div class="row">
    <button id="play" aria-label="播放">▶</button>
    <div class="bar"><div id="fill"></div></div>
    <div class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></div>
  </div>
  <div class="speeds">
    <button data-src="audio/day-@@DAY@@.mp3" class="on">正常语速</button>
    <button data-src="audio/day-@@DAY@@-0.75x.mp3">慢速 0.75x</button>
  </div>
  <div class="modes">
    <button data-mode="both" class="on">双语</button>
    <button data-mode="en">只看英文</button>
    <button data-mode="zh">只看中文</button>
  </div>
</div>

<audio id="au" preload="metadata" src="audio/day-@@DAY@@.mp3"></audio>

<h2>课文</h2>
<div class="article" id="article">@@ARTICLE@@</div>

<h2>今日单词 · @@NWORDS@@</h2>
@@WORDLIST@@

<footer>刘晓燕《四级你还在背单词吗》@@UNIT@@ · Day @@DAY@@</footer>
</div>

<script>
const au = document.getElementById('au');
const fill = document.getElementById('fill');
const cur = document.getElementById('cur');
const dur = document.getElementById('dur');
const btn = document.getElementById('play');
const spans = [...document.querySelectorAll('.w')];
const pairs = [...document.querySelectorAll('.pair')];
let idx = 0, pIdx = -1, raf = null;

const fmt = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00';

// 逐词 / 逐句各存一份时间表，方便二分查找
const times = spans.map(el => ({ s: +el.dataset.s / 1000, e: +el.dataset.e / 1000, el }));
const pt = pairs.map(el => ({ s: +el.dataset.s0 / 1000, e: +el.dataset.s1 / 1000, el }));

// 通用二分：找到时间 t 落在哪个区间
function find(arr, t, keepIdx) {
  let lo = 0, hi = arr.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid].e <= t) lo = mid + 1;
    else if (arr[mid].s > t) hi = mid - 1;
    else return mid;
  }
  return keepIdx;   // 落在空隙：保持上一个，避免闪断
}

function highlight(t) {
  const w = find(times, t, idx);
  if (w !== idx) {
    if (times[idx] && times[idx].el) times[idx].el.classList.remove('on');
    idx = w;
    if (times[w] && times[w].el) times[w].el.classList.add('on');
  }

  const p = find(pt, t, pIdx);
  if (p !== pIdx) {
    if (pt[pIdx] && pt[pIdx].el) pt[pIdx].el.classList.remove('now');
    pIdx = p;
    if (pt[p] && pt[p].el) {
      pt[p].el.classList.add('now');
      // 逐句滚动跟随 —— 句比词大，滚动不会太频繁，体验更稳
      const r = pt[p].el.getBoundingClientRect();
      if (r.top < 150 || r.bottom > innerHeight - 80) {
        pt[p].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }
  }
}

function tick() {
  if (!au.paused) {
    highlight(au.currentTime);
    fill.style.width = (au.currentTime / au.duration * 100 || 0) + '%';
    cur.textContent = fmt(au.currentTime);
    raf = requestAnimationFrame(tick);
  }
}

au.addEventListener('loadedmetadata', () => dur.textContent = fmt(au.duration));
au.addEventListener('play',  () => { btn.textContent = '❚❚'; tick(); });
au.addEventListener('pause', () => { btn.textContent = '▶'; cancelAnimationFrame(raf); });
au.addEventListener('ended', () => { btn.textContent = '▶'; fill.style.width='100%'; });
au.addEventListener('timeupdate', () => {
  cur.textContent = fmt(au.currentTime);
  fill.style.width = (au.currentTime / au.duration * 100 || 0) + '%';
});

btn.onclick = () => au.paused ? au.play() : au.pause();

// 点词跳转
spans.forEach(el => el.addEventListener('click', () => {
  au.currentTime = +el.dataset.s / 1000;
  if (au.paused) au.play();
}));

// 点句子空白处 -> 跳到那句开头
pairs.forEach(el => el.addEventListener('click', (ev) => {
  if (ev.target.classList.contains('w')) return;  // 点词走上面的逻辑
  au.currentTime = +el.dataset.s0 / 1000;
  if (au.paused) au.play();
}));

// 显示模式：双语 / 只看英文 / 只看中文
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.modes button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  document.body.classList.remove('mode-en', 'mode-zh');
  if (b.dataset.mode === 'en') document.body.classList.add('mode-en');
  if (b.dataset.mode === 'zh') document.body.classList.add('mode-zh');
  localStorage.setItem('cet4-mode', b.dataset.mode);
});
// 记住上次选的模式
(function () {
  const saved = localStorage.getItem('cet4-mode');
  if (saved && saved !== 'both') {
    const b = document.querySelector(`.modes button[data-mode="${saved}"]`);
    if (b) b.click();
  }
})();

// 语速切换
document.querySelectorAll('.speeds button').forEach(b => b.onclick = () => {
  const was = !au.paused, t = au.currentTime;
  document.querySelectorAll('.speeds button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  au.src = b.dataset.src;
  au.load();
  au.addEventListener('loadedmetadata', function once() {
    au.removeEventListener('loadedmetadata', once);
    au.currentTime = Math.min(t, au.duration - 0.1);
    if (was) au.play();
  });
});
</script>
</body>
</html>
