name: 每日推送

# 每天早上把当天的精读页面推到微信。
#
# 注意：这里 **不生成任何内容**。
# 文章和音频都是本地生成好、随仓库一起提交的。
# 本工作流只做一件事：调 PushPlus API 发一条消息。
#
# 之所以这样做：GitHub 服务器在国内网络环境下调 MiniMax 不稳定，
# 而且音频生成是重活，放本地做更可控。

on:
  schedule:
    # 每天 07:00（北京时间）。GitHub 用 UTC，北京时间 = UTC+8，所以写 23:00 前一天。
    - cron: "0 23 * * *"
  workflow_dispatch:        # 也支持手动触发（调试用）
    inputs:
      day:
        description: "指定第几天（留空=自动按日期算）"
        required: false

# 保活那一步要往仓库写空提交，需要 contents: write。
# 不加这个的话，Actions 默认只有只读权限，git push 会 403
# （实测报错：Permission to 293451/cet4.git denied to github-actions[bot]）。
permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            python build/push_web.py --day "${{ github.event.inputs.day }}"
          else
            python build/push_web.py
          fi

      # 让仓库保持「活跃」，避免 GitHub 在 60 天无活动后自动禁用定时任务。
      # 用空提交，不产生文件，也就不和 .gitignore 打架。
      - name: 保活
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: 每日保活 $(date -u +%Y-%m-%d)"
          git push
